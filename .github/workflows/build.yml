on: 
  push:
    branches: [ "main" ]
    paths: [ "**.go" ]
  workflow_dispatch:
name: Build
jobs:
  buildmin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.16.x
        check-latest: true
    - name: Build
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: buildmin-result
        path: .

  buildmax:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true
        cache: true
    - name: Build
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: buildmax-result
        path: .
